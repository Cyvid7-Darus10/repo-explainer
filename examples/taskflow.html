      el.querySelector('path').setAttribute('marker-end', active ? 'url(#arrow-active)' : 'url(#arrow)');
    });
  }

  function renderDetail() {
    fill(detail, ...(selectedId ? nodeDetail(nodeIndex.get(selectedId)) : emptyDetail()));
  }

  function emptyDetail() {
    return [h('div', { class: 'detail-main' },
      h('div', { class: 'detail-label', style: 'margin-top:0' }, 'Tip'),
      h('h3', null, 'Tap any box above'),
      h('p', null, 'You will see what it does, which files hold it, and who it talks to. Tap it again to clear.'))];
  }

  function nodeDetail(node) {
    const layer = layers.find((l) => l.id === node.layer);
    const links = related(node.id);
    const flows = list(data.flows).filter((flow) => list(flow.steps).some((st) => st.from === node.id || st.to === node.id));
    return [h('div', { class: 'detail-main' },
      h('div', { class: 'step-top' }, h('span', { class: 'tag' }, text(layer && layer.label, node.layer)), node.kind && h('span', { class: 'tag tag-request' }, node.kind)),
      h('h3', null, node.label),
      h('p', null, text(node.summary, 'No summary yet.')),
      node.tech && h('p', { class: 'detail-label' }, node.tech),
      list(node.files).length > 0 && [h('div', { class: 'detail-label' }, 'Lives in'), h('div', { class: 'files' }, list(node.files).map(fileChip))]),
    h('div', { class: 'detail-side' },
      links.length > 0 && [h('div', { class: 'detail-label' }, 'Talks to'), h('ul', { class: 'rel' }, links.map((edge) => relationItem(edge, node.id)))],
      flows.length > 0 && [h('div', { class: 'detail-label' }, 'Shows up in'), h('ul', { class: 'rel' }, flows.map((flow) => h('li', null,
        h('button', { class: 'link', type: 'button', onclick: () => emit('open-flow', { flowId: flow.id }) }, `▶ ${flow.title}`))))]),
    ];
  }

  function relationItem(edge, selfId) {
    const otherId = edge.from === selfId ? edge.to : edge.from;
    const other = nodeIndex.get(otherId);
    const direction = edge.from === selfId ? '→' : '←';
    return h('li', null, h('span', { class: 'arrow-glyph' }, direction),
      h('button', { class: 'link', type: 'button', onclick: () => select(otherId) }, other ? other.label : otherId),
      edge.label && h('span', { class: 'tag' }, edge.label));
  }

  function drawEdges() {
    const box = canvas.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    const defs = s('defs', null, arrowMarker('arrow', '#e5e5e5'), arrowMarker('arrow-active', '#1cb0f6'));
    const paths = edges.map((edge) => edgeShape(edge, box)).filter(Boolean);
    fill(svg, defs, ...paths);
    paintSelection();
    if (canvas.dataset.changes === 'on') showChanges();
  }

  function edgeShape(edge, box) {
    const fromEl = grid.querySelector(`[data-node="${CSS.escape(edge.from)}"]`);
    const toEl = grid.querySelector(`[data-node="${CSS.escape(edge.to)}"]`);
    if (!fromEl || !toEl) return null;
    const a = relativeRect(fromEl, box);
    const b = relativeRect(toEl, box);
    const d = connectorPath(a, b);
    const key = `${edge.from}→${edge.to}`;
    const mid = { x: (a.cx + b.cx) / 2, y: (a.cy + b.cy) / 2 };
    return s('g', { 'data-edge': key },
      s('path', { class: `edge${edge.kind === 'async' ? ' is-async' : ''}`, d, 'marker-end': 'url(#arrow)' }),
      edge.label && s('text', { class: 'edge-label', x: mid.x, y: mid.y - 6, 'text-anchor': 'middle' }, truncate(edge.label, 28)));
  }

  function showChanges() {
    canvas.classList.remove('has-selection');
    canvas.classList.add('is-changes');
    grid.querySelectorAll('.node').forEach((el) => el.classList.toggle('is-changed', changedIds.has(el.dataset.node)));
  }

  on('highlight-changes', ({ enabled }) => {
    canvas.dataset.changes = enabled ? 'on' : 'off';
    selectedId = null;
    renderDetail();
    if (enabled) showChanges(); else paintSelection();
    canvas.scrollIntoView({ block: 'center' });
  });

  renderDetail();
  mount.append(
    h('div', { class: 'map-shell' }, h('div', { class: 'map-scroll' }, canvas), detail),
    h('div', { class: 'map-legend' },
      h('span', null, h('i'), 'Calls / reads'),
      h('span', null, h('i', { class: 'dash' }), 'Async / events'),
      changedIds.size > 0 && h('span', null, h('span', { class: 'tag tag-new' }, 'new'), 'Changed recently')),
  );
  const redraw = () => window.requestAnimationFrame(drawEdges);
  new ResizeObserver(redraw).observe(canvas);
  if (document.fonts) document.fonts.ready.then(redraw);
}

function mapColumn(layer, nodes, changedIds, onSelect) {
  const colors = paletteFor(layer.color);
  const layerNodes = nodes.filter((node) => node.layer === layer.id);
  return h('div', { class: 'map-col', style: `--layer:${colors.ink};--layer-wash:${colors.wash};--layer-ink:${colors.text}` },
    h('div', { class: 'map-col-head' }, layer.label),
    layerNodes.map((node) => h('button', {
      class: 'node', type: 'button', 'data-node': node.id, 'aria-pressed': 'false', onclick: () => onSelect(node.id),
    },
    changedIds.has(node.id) && h('span', { class: 'node-badge tag tag-new' }, 'new'),
    icon(node.kind),
    h('span', { class: 'node-text' }, h('span', { class: 'node-label' }, node.label), node.tech && h('span', { class: 'node-tech' }, node.tech)))));
}

function relativeRect(el, box) {
  const r = el.getBoundingClientRect();
  const left = r.left - box.left;
  const top = r.top - box.top;
  return { left, top, right: left + r.width, bottom: top + r.height, cx: left + r.width / 2, cy: top + r.height / 2 };
}

function connectorPath(a, b) {
  const horizontal = Math.abs(b.cx - a.cx) > Math.abs(b.cy - a.cy);
  if (horizontal) {
    const forward = b.cx > a.cx;
    const x1 = forward ? a.right : a.left;
    const x2 = forward ? b.left - 4 : b.right + 4;
    const bend = (x2 - x1) / 2;
    return `M${x1},${a.cy} C${x1 + bend},${a.cy} ${x2 - bend},${b.cy} ${x2},${b.cy}`;
  }
  const down = b.cy > a.cy;
  const y1 = down ? a.bottom : a.top;
  const y2 = down ? b.top - 4 : b.bottom + 4;
  const bend = (y2 - y1) / 2;
  return `M${a.cx},${y1} C${a.cx},${y1 + bend} ${b.cx},${y2 - bend} ${b.cx},${y2}`;
}

function arrowMarker(id, color) {
  return s('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 10, markerHeight: 10, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' },
    s('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }));
}

// ---- models.js ----
// Chapter: the data. An entity-relationship diagram (same interaction as the
// architecture map) plus a roomy field table for the selected entity.
const CARDINALITY = {
  'has many': ['1', 'N'],
  'has one': ['1', '1'],
  'belongs to': ['N', '1'],
  'many to many': ['N', 'M'],
};

// One edge per pair: "Team has many User" and "User belongs to Team" are the
// same line, so keep the first and drop its mirror.
function relationEdges(models) {
  const names = new Set(models.map((m) => m.name));
  const seen = new Set();
  return models.flatMap((model) => list(model.relations)
    .filter((rel) => names.has(rel.to) && rel.to !== model.name)
    .map((rel) => {
      const key = [model.name, rel.to].sort().join('|');
      if (seen.has(key)) return null;
      seen.add(key);
      const kind = text(rel.kind, 'relates to').toLowerCase();
      return { from: model.name, to: rel.to, kind, ends: CARDINALITY[kind] || ['', ''] };
    })
    .filter(Boolean));
}

// Zig-zag order: start at the most connected entity, then walk neighbours so
// related boxes sit next to each other.
function entityOrder(models, edges) {
  const degree = (name) => edges.filter((e) => e.from === name || e.to === name).length;
  const byDegree = [...models].sort((a, b) => degree(b.name) - degree(a.name));
  const order = [];
  const visit = (model) => {
    if (!model || order.includes(model)) return;
    order.push(model);
    edges.filter((e) => e.from === model.name || e.to === model.name)
      .map((e) => models.find((m) => m.name === (e.from === model.name ? e.to : e.from)))
      .forEach(visit);
  };
  byDegree.forEach(visit);
  return order;
}

// PK: named "id" or noted as primary. FK: explicit `ref`, or "<model>Id" / "<model>_id".
// Ids of outside systems (stripeCustomerId) are not FKs, so no suffix guessing.
function fieldBadges(field, modelNames) {
  const name = text(field.name);
  const lower = name.toLowerCase();
  const isPk = name === 'id' || /\bprimary\b/i.test(text(field.note));
  const named = [...modelNames].find((m) => lower === `${m.toLowerCase()}id` || lower === `${m.toLowerCase()}_id`);
  const fkTarget = modelNames.has(field.ref) ? field.ref : named;
  return { isPk, fkTarget, isFk: Boolean(fkTarget) };
}

function renderModels(data, mount) {
  const models = list(data.dataModel);
  const edges = relationEdges(models);
  const ordered = entityOrder(models, edges);
  const modelNames = new Set(models.map((m) => m.name));
  const svg = s('svg', { class: 'map-edges', 'aria-hidden': 'true' });
  const grid = h('div', { class: 'er-grid', style: `--er-cols:${ordered.length + 1}` },
    ordered.map((model, i) => entityBox(model, i, modelNames, () => select(model.name))));
  const canvas = h('div', { class: 'map-canvas er-canvas', style: `--er-cols:${ordered.length + 1}` }, svg, grid);
  const detail = h('div', { class: 'card er-detail', 'aria-live': 'polite' });
  let selected = ordered[0] ? ordered[0].name : null;

  function select(name) {
    selected = name;
    paint();
    fill(detail, ...modelDetail(models.find((m) => m.name === name)));
  }

  function paint() {
    const related = new Set(edges.filter((e) => e.from === selected || e.to === selected).flatMap((e) => [e.from, e.to]));
    canvas.classList.add('has-selection');
    grid.querySelectorAll('.entity').forEach((el) => {
      el.classList.toggle('is-selected', el.dataset.entity === selected);
      el.classList.toggle('is-related', related.has(el.dataset.entity));
      el.setAttribute('aria-pressed', String(el.dataset.entity === selected));
    });
    svg.querySelectorAll('[data-edge]').forEach((g) => {
      const [from, to] = g.dataset.edge.split('→');
      const active = from === selected || to === selected;
      g.querySelectorAll('path, text').forEach((part) => part.classList.toggle('is-active', active));
    });
  }

  function modelDetail(model) {
    if (!model) return [];
    const rels = edges.filter((e) => e.from === model.name || e.to === model.name);
    return [
      h('div', { class: 'er-detail-head' },
        h('h3', null, icon('db'), model.name),
        model.summary && h('p', null, model.summary)),
      h('div', { class: 'er-fields', role: 'table', 'aria-label': `${model.name} fields` },
        h('div', { class: 'er-row er-row-head', role: 'row' },
          h('span', { role: 'columnheader' }, 'Field'), h('span', { role: 'columnheader' }, 'Type'), h('span', { role: 'columnheader' }, 'Meaning')),
        list(model.fields).map((field) => fieldRow(field, modelNames, select))),
      rels.length > 0 && h('div', { class: 'er-rels' },
        h('div', { class: 'detail-label' }, 'Relationships'),
        h('ul', { class: 'rel' }, rels.map((edge) => {
          const other = edge.from === model.name ? edge.to : edge.from;
          const [a, b] = edge.from === model.name ? edge.ends : [...edge.ends].reverse();
          return h('li', null,
            h('span', { class: 'tag' }, `${a || '?'} : ${b || '?'}`),
            h('span', null, `${model.name} ${edge.from === model.name ? edge.kind : 'is linked from'} `),
            h('button', { class: 'link', type: 'button', onclick: () => select(other) }, other));
        }))),
    ];
  }

  function drawEdges() {
    const box = canvas.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    fill(svg, s('defs', null), edges.map((edge) => relationShape(edge, grid, box)).filter(Boolean));
    paint();
  }

  if (!models.length) return;
  mount.append(h('div', { class: 'map-scroll' }, canvas), detail);
  select(selected);
  const redraw = () => window.requestAnimationFrame(drawEdges);
  new ResizeObserver(redraw).observe(canvas);
  if (document.fonts) document.fonts.ready.then(redraw);
}

function entityBox(model, index, modelNames, onSelect) {
  // Zig-zag: each box spans two tracks and steps one track right, alternating rows.
  const row = index % 2;
  const col = index + 1;
  const keys = list(model.fields).filter((f) => {
    const b = fieldBadges(f, modelNames);
    return b.isPk || b.isFk;
  }).slice(0, 4);
  return h('button', {
    class: 'entity', type: 'button', 'data-entity': model.name, 'aria-pressed': 'false',
    style: `grid-column:${col} / span 2;grid-row:${row + 1}`, onclick: onSelect,
  },
  h('span', { class: 'entity-head' }, icon('db'), h('span', { class: 'entity-name' }, model.name), h('span', { class: 'entity-count' }, `${list(model.fields).length} fields`)),
  keys.length > 0 && h('span', { class: 'entity-keys' }, keys.map((f) => {
    const b = fieldBadges(f, modelNames);
    return h('span', { class: 'entity-key' }, h('span', { class: `key-badge ${b.isPk ? 'is-pk' : 'is-fk'}` }, b.isPk ? 'PK' : 'FK'), f.name);
  })));
}

function fieldRow(field, modelNames, select) {
  const b = fieldBadges(field, modelNames);
  return h('div', { class: 'er-row', role: 'row' },
    h('span', { class: 'er-name', role: 'cell' },
      h('code', null, field.name),
      b.isPk && h('span', { class: 'key-badge is-pk' }, 'PK'),
      b.isFk && h('span', { class: 'key-badge is-fk' }, 'FK'),
      b.fkTarget && h('button', { class: 'link er-fk', type: 'button', onclick: () => select(b.fkTarget) }, `→ ${b.fkTarget}`)),
    h('span', { class: 'er-type', role: 'cell' }, h('code', null, text(field.type, '—'))),
    h('span', { class: 'er-note', role: 'cell' }, text(field.note, '')));
}

function relationShape(edge, grid, box) {
  const fromEl = grid.querySelector(`[data-entity="${CSS.escape(edge.from)}"]`);
  const toEl = grid.querySelector(`[data-entity="${CSS.escape(edge.to)}"]`);
  if (!fromEl || !toEl) return null;
  const a = relativeRect(fromEl, box);
  const b = relativeRect(toEl, box);
  const d = connectorPath(a, b);
  const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
  const [x1, y1] = nums;
  const [x2, y2] = nums.slice(-2);
  const nudge = (x, y, tx, ty) => {
    const len = Math.hypot(tx - x, ty - y) || 1;
    return { x: x + ((tx - x) / len) * 18 + 8, y: y + ((ty - y) / len) * 18 - 4 };
  };
  const startLabel = nudge(x1, y1, x2, y2);
  const endLabel = nudge(x2, y2, x1, y1);
  return s('g', { 'data-edge': `${edge.from}→${edge.to}` },
    s('path', { class: 'edge', d }),
    s('text', { class: 'er-card', x: startLabel.x, y: startLabel.y, 'text-anchor': 'middle' }, edge.ends[0]),
    s('text', { class: 'er-card', x: endLabel.x, y: endLabel.y, 'text-anchor': 'middle' }, edge.ends[1]),
    s('text', { class: 'edge-label', x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 8, 'text-anchor': 'middle' }, edge.kind));
}

// ---- flow.js ----
// Chapter: end-to-end flow player. A sequence diagram you step through one
// hop at a time, Brilliant-style: one idea per screen, a big Continue button.
const SEQ = { minCol: 130, maxCol: 220, head: 70, top: 40, row: 58, pad: 20 };
const DASHED_KINDS = new Set(['response', 'async']);

function renderFlows(data, mount) {
  const flows = list(data.flows);
  if (!flows.length) {
    mount.append(h('p', { class: 'empty' }, 'No flows traced yet.'));
    return;
  }
  const nodeIndex = byId(data.nodes);
  let state = { flowIndex: 0, stepIndex: 0, finished: false, direction: 1 };

  const tabs = h('div', { class: 'flow-tabs', role: 'tablist', 'aria-label': 'Flows' });
  const meta = h('div', { class: 'flow-meta' });
  const headsWrap = h('div', { class: 'seq-heads-wrap' });
  const bodyWrap = h('div', { class: 'seq-body' });
  const seqWrap = h('div', { class: 'seq-wrap seq', 'aria-label': 'Sequence diagram' }, headsWrap, bodyWrap);
  // The body scrolls sideways only; the sticky header strip follows it.
  bodyWrap.addEventListener('scroll', () => {
    if (headsWrap.firstElementChild) headsWrap.firstElementChild.style.transform = `translateX(${-bodyWrap.scrollLeft}px)`;
  }, { passive: true });
  const panel = h('div', { class: 'card step-card', 'aria-live': 'polite' });
  const root = h('div', { class: 'flow-player' }, tabs, meta, h('div', { class: 'flow-layout' }, seqWrap, panel));
  let lastWidth = 0;
  new ResizeObserver(() => {
    if (Math.abs(seqWrap.clientWidth - lastWidth) > 24) { lastWidth = seqWrap.clientWidth; render(); }
  }).observe(seqWrap);

  function setState(next) {
    state = { ...state, ...next };
    render({ animate: true });
  }

  function go(stepIndex) {
    const steps = list(flows[state.flowIndex].steps);
    if (stepIndex >= steps.length) return setState({ finished: true, direction: 1 });
    return setState({ stepIndex: Math.max(0, stepIndex), finished: false, direction: stepIndex >= state.stepIndex ? 1 : -1 });
  }

  function render({ animate = false } = {}) {
    const flow = flows[state.flowIndex];
    fill(tabs, ...flows.map((f, i) => h('button', {
      class: 'chip flow-tab', type: 'button', role: 'tab', 'aria-selected': String(i === state.flowIndex),
      onclick: () => setState({ flowIndex: i, stepIndex: 0, finished: false }),
    }, `${i + 1}. ${f.title}`)));
    fill(meta,
      flow.trigger && h('span', { class: 'chip' }, '⚡ ', flow.trigger),
      h('span', { class: 'chip' }, `${list(flow.steps).length} steps`),
      flow.summary && h('p', { style: 'flex-basis:100%' }, flow.summary),
    );
    const diagram = sequenceDiagram(flow, nodeIndex, state.finished ? list(flow.steps).length : state.stepIndex, go, bodyWrap.clientWidth);
    fill(headsWrap, diagram.heads);
    fill(bodyWrap, diagram.body);
    centerCurrentStep(bodyWrap, animate);
    fill(panel, ...(state.finished ? finishedPanel(flow) : stepPanel(flow)));
    const current = diagram.body.querySelector('.seq-step.is-current .arrow');
    if (current) {
      const marker = current.dataset.marker;
      if (animate) drawPath(current, marker); else current.setAttribute('marker-end', marker);
    }
    if (animate) slideIn(panel.firstElementChild, state.direction);
    if (animate && !state.finished) revealCurrentStep(diagram.body);
    if (animate && state.finished) pop(panel.querySelector('.trophy'));
  }

  function stepPanel(flow) {
    const steps = list(flow.steps);
    const step = steps[state.stepIndex];
    const from = nodeIndex.get(step.from);
    const to = nodeIndex.get(step.to);
    const last = state.stepIndex === steps.length - 1;
    return [h('div', { class: 'step-body' }, h('div', { class: 'step-text' },
      h('div', { class: 'step-top' },
        h('span', { class: 'step-count' }, `Step ${state.stepIndex + 1} of ${steps.length}`),
        step.kind && h('span', { class: `tag tag-${step.kind}` }, step.kind)),
      h('div', { class: 'step-route' },
        from && icon(from.kind), text(from && from.label, step.from),
        h('span', { class: 'arrow-glyph', 'aria-hidden': 'true' }, step.from === step.to ? '↺' : '→'),
        step.from !== step.to && [to && icon(to.kind), text(to && to.label, step.to)]),
      h('h3', null, step.label),
      step.detail && h('p', null, step.detail),
      step.why && h('div', { class: 'callout' }, h('b', null, 'Why it works this way'), step.why)),
      (step.file || step.code) && h('div', { class: 'step-code' },
        step.file && h('div', { class: 'code-head', style: 'margin-top:0' }, fileChip(step.file)),
        step.code && codeBlock(step.code, step.lang))),
      h('div', { class: 'step-controls' },
        h('button', { class: 'btn btn-ghost btn-sm', type: 'button', disabled: state.stepIndex === 0, onclick: () => go(state.stepIndex - 1) }, 'Back'),
        stepDots(steps.length, state.stepIndex, go),
        h('button', { class: 'btn btn-primary', type: 'button', onclick: () => go(state.stepIndex + 1) }, last ? 'Finish' : 'Continue')),
      h('p', { class: 'kbd-hint' }, 'Tip: use ', h('kbd', null, '←'), ' ', h('kbd', null, '→'), ' to step through.'),
    ];
  }

  function finishedPanel(flow) {
    const steps = list(flow.steps);
    const actors = new Set(steps.flatMap((st) => [st.from, st.to]));
    const nextIndex = state.flowIndex + 1;
    return [h('div', { class: 'flow-done' },
      icon('trophy', { class: 'trophy' }),
      h('h3', null, 'Flow complete!'),
      h('p', null, `You followed “${flow.title}” through ${steps.length} steps and ${actors.size} parts of the system.`),
      h('div', { class: 'btn-row', style: 'justify-content:center' },
        h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => go(0) }, 'Replay'),
        nextIndex < flows.length && h('button', { class: 'btn btn-primary', type: 'button', onclick: () => setState({ flowIndex: nextIndex, stepIndex: 0, finished: false }) }, 'Next flow')))];
  }

  root.addEventListener('keydown', (event) => {
    if (event.target.closest('input, textarea')) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); go(state.stepIndex + 1); }
    if (event.key === 'ArrowLeft') { event.preventDefault(); go(state.finished ? state.stepIndex : state.stepIndex - 1); }
  });

  on('open-flow', ({ flowId }) => {
    const index = flows.findIndex((f) => f.id === flowId);
    if (index < 0) return;
    setState({ flowIndex: index, stepIndex: 0, finished: false });
    root.scrollIntoView({ block: 'start' });
  });

  render();
  mount.append(root);
}

function stepDots(count, current, go) {
  if (count > 14) return h('span', { class: 'step-count' }, `${current + 1} / ${count}`);
  return h('div', { class: 'step-dots' }, Array.from({ length: count }, (_, i) => h('button', {
    type: 'button', class: i === current ? 'is-current' : i < current ? 'is-done' : '', 'aria-label': `Go to step ${i + 1}`, onclick: () => go(i),
  })));
}

function flowActors(steps) {
  return [...new Set(steps.flatMap((step) => [step.from, step.to]))];
}

// Two SVGs share one scroll box: a sticky strip of actor heads and the steps.
function sequenceDiagram(flow, nodeIndex, currentIndex, go, available) {
  const steps = list(flow.steps);
  const actors = flowActors(steps);
  const fit = ((available || 0) - SEQ.pad * 2) / Math.max(actors.length, 1);
  const col = Math.min(SEQ.maxCol, Math.max(SEQ.minCol, fit));
  const width = SEQ.pad * 2 + actors.length * col;
  const height = SEQ.top + steps.length * SEQ.row;
  const xOf = (id) => SEQ.pad + actors.indexOf(id) * col + col / 2;
  const headW = Math.min(col - 16, 170);
  const chars = Math.floor((headW - 52) / 7.5);
  const heads = s('svg', { class: 'seq-heads', viewBox: `0 0 ${width} ${SEQ.head}`, width, height: SEQ.head, 'aria-hidden': 'true' });
  const body = s('svg', { viewBox: `0 0 ${width} ${height}`, width, height, role: 'img', 'aria-label': `${flow.title}: ${steps.length} steps` });

  actors.forEach((id) => {
    const node = nodeIndex.get(id);
    const x = xOf(id);
    heads.append(
      s('rect', { x: x - headW / 2, y: 14, width: headW, height: 50, rx: 12, fill: '#e5e5e5' }),
      s('rect', { x: x - headW / 2, y: 10, width: headW, height: 50, rx: 12, fill: '#fff', stroke: '#e5e5e5', 'stroke-width': 2 }),
      icon(node ? node.kind : 'service', { x: x - headW / 2 + 10, y: 21, width: 28, height: 28 }),
      s('text', { class: 'seq-head-label', x: x - headW / 2 + 44, y: 40 }, truncate(node ? node.label : id, chars), s('title', null, node ? node.label : id)),
    );
    body.append(s('line', { class: 'seq-lifeline', x1: x, x2: x, y1: 0, y2: height }));
  });

  steps.forEach((step, i) => body.append(sequenceStep(step, i, currentIndex, xOf, width, go, col)));
  return { heads, body };
}

function sequenceStep(step, i, currentIndex, xOf, width, go, col) {
  const y = SEQ.top + i * SEQ.row;
  const status = i < currentIndex ? 'is-done' : i === currentIndex ? 'is-current' : 'is-todo';
  const x1 = xOf(step.from);
  const x2 = xOf(step.to);
  const self = step.from === step.to;
  const dir = x2 >= x1 ? 1 : -1;
  const d = self
    ? `M${x1},${y} h44 v18 h-40`
    : `M${x1 + dir * 12},${y} L${x2 - dir * 8},${y}`;
  const labelX = self ? x1 + 52 : (x1 + x2) / 2;
  const group = s('g', {
    class: `seq-step ${status}${DASHED_KINDS.has(step.kind) ? ' is-dashed' : ''}`,
    role: 'button', tabindex: '0', 'aria-label': `Step ${i + 1}: ${step.label}`,
    onclick: () => go(i),
    onkeydown: (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); go(i); } },
  },
  s('rect', { class: 'hit', x: 4, y: y - 30, width: width - 8, height: SEQ.row - 4, rx: 10 }),
  s('path', status === 'is-current'
    ? { class: 'arrow', d, 'data-marker': `url(#seq-arrow-${status})` }
    : { class: 'arrow', d, 'marker-end': `url(#seq-arrow-${status})` }),
  s('circle', { class: 'badge-bg', cx: x1, cy: y, r: 11 }),
  s('text', { class: 'badge-num', x: x1, y: y + 4, 'text-anchor': 'middle' }, String(i + 1)),
  s('text', { class: 'label', x: labelX, y: y - 10, 'text-anchor': self ? 'start' : 'middle' },
    truncate(step.label, Math.max(14, Math.floor(((self ? col : Math.abs(x2 - x1)) - 16) / 6.6))), s('title', null, step.label)));

  if (i === 0) group.prepend(seqMarkers());
  if (status === 'is-current' && !reducedMotion()) {
    // One pass along the arrow after it draws, then fade — no endless loop.
    group.append(s('circle', { class: 'seq-dot', r: 6, opacity: 0 },
      s('set', { attributeName: 'opacity', to: 1, begin: '0.3s' }),
      s('animateMotion', { dur: '0.6s', begin: '0.3s', fill: 'freeze', path: d, calcMode: 'spline', keyTimes: '0;1', keySplines: '0.4 0 0.2 1' }),
      s('animate', { attributeName: 'opacity', from: 1, to: 0, begin: '0.9s', dur: '0.3s', fill: 'freeze' })));
  }
  return group;
}

function seqMarkers() {
  const marker = (status, color) => s('marker', { id: `seq-arrow-${status}`, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 11, markerHeight: 11, markerUnits: 'userSpaceOnUse', orient: 'auto' },
    s('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }));
  return s('defs', null, marker('is-done', '#777777'), marker('is-current', '#58cc02'), marker('is-todo', '#e5e5e5'));
}

// Only on reader actions: bring the active hop into view without fighting
// the page's own scrolling.
function centerCurrentStep(bodyWrap, animate) {
  const badge = bodyWrap.querySelector('.seq-step.is-current .badge-bg');
  if (!badge) return;
  const left = Number(badge.getAttribute('cx')) - bodyWrap.clientWidth / 3;
  bodyWrap.scrollTo({ left: Math.max(0, left), behavior: animate && !reducedMotion() ? 'smooth' : 'auto' });
}

function revealCurrentStep(diagram) {
  const current = diagram.querySelector('.seq-step.is-current');
  if (!current) return;
  const box = current.getBoundingClientRect();
  const headerBottom = 200;
  if (box.top < headerBottom || box.bottom > window.innerHeight - 24) {
    current.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
  }
}

// ---- changes.js ----
// Chapter: what changed and why. Built for repos where many humans and
// agents merge every day — each change carries its reason and the parts of
// the system it touched, so readers can re-sync their mental model fast.
const AUTHOR_FILTERS = [
  { id: 'all', label: 'Everyone' },
  { id: 'agent', label: 'Agents' },
  { id: 'human', label: 'Humans' },
];

function renderChanges(data, mount) {
  const changes = [...list(data.changes)].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (!changes.length) {
    mount.append(h('p', { class: 'empty' }, 'No recent changes recorded.'));
    return;
  }
  const nodeIndex = byId(data.nodes);
  let state = { author: 'all', kind: 'all', onMap: false };

  const kinds = ['all', ...new Set(changes.map((c) => c.kind).filter(Boolean))];
  const toolbar = h('div', { class: 'changes-toolbar' });
  const timeline = h('ol', { class: 'timeline' });

  function setState(next) {
    state = { ...state, ...next };
    render();
    [...timeline.children].slice(0, 8).forEach((item, i) => riseIn(item, i * 35));
  }

  function visible() {
    return changes.filter((c) => (state.author === 'all' || c.authorType === state.author)
      && (state.kind === 'all' || c.kind === state.kind));
  }

  function render() {
    fill(toolbar,
      h('div', { class: 'filter-group', role: 'group', 'aria-label': 'Filter by author' },
        AUTHOR_FILTERS.map((f) => filterChip(f.label, state.author === f.id, () => setState({ author: f.id })))),
      kinds.length > 2 && h('div', { class: 'filter-group', role: 'group', 'aria-label': 'Filter by type' },
        kinds.map((k) => filterChip(k === 'all' ? 'All types' : k, state.kind === k, () => setState({ kind: k })))),
      h('button', {
        class: `btn btn-sm ${state.onMap ? 'btn-blue' : 'btn-ghost'}`, type: 'button', 'aria-pressed': String(state.onMap),
        onclick: () => { emit('highlight-changes', { enabled: !state.onMap }); setState({ onMap: !state.onMap }); },
      }, state.onMap ? 'Hide on map' : 'Show on map'),
    );
    const items = visible();
    fill(timeline, ...(items.length
      ? items.map((change) => changeItem(change, nodeIndex))
      : [h('li', { class: 'empty' }, 'Nothing matches these filters.')]));
  }

  render();
  mount.append(changeStats(changes), toolbar, timeline);
}

function filterChip(label, pressed, onclick) {
  return h('button', { class: 'chip', type: 'button', 'aria-pressed': String(pressed), onclick }, label);
}

function changeStats(changes) {
  const agents = changes.filter((c) => c.authorType === 'agent').length;
  const touched = new Set(changes.flatMap((c) => list(c.nodes))).size;
  const stat = (value, label) => h('div', { class: 'stat' }, h('b', null, String(value)), h('span', null, label));
  return h('div', { class: 'changes-stats' },
    stat(changes.length, 'changes'),
    stat(agents, 'by agents'),
    stat(changes.length - agents, 'by humans'),
    stat(touched, 'parts touched'));
}

function changeItem(change, nodeIndex) {
  const isAgent = change.authorType === 'agent';
  return h('li', { class: `change ${isAgent ? 'is-agent' : 'is-human'}` },
    h('div', { class: 'change-dot', 'aria-hidden': 'true' }, icon(isAgent ? 'robot' : 'user')),
    h('article', { class: 'card change-card' },
      h('div', { class: 'change-top' },
        h('span', null, formatDate(change.date)),
        change.ref && (safeUrl(change.url)
          ? h('a', { class: 'link', href: safeUrl(change.url), target: '_blank', rel: 'noopener noreferrer' }, change.ref)
          : h('span', null, change.ref)),
        h('span', { class: `tag ${isAgent ? 'tag-agent' : 'tag-human'}` }, isAgent ? 'agent' : 'human'),
        change.author && h('span', null, change.author),
        change.kind && h('span', { class: 'tag' }, change.kind)),
      h('h3', null, change.title),
      change.what && h('p', null, change.what),
      change.why && h('div', { class: 'change-why' }, h('b', null, 'Why'), change.why),
      change.risk && h('p', { class: 'change-risk' }, '⚠ ', change.risk),
      list(change.nodes).length > 0 && h('div', { class: 'change-nodes' }, list(change.nodes).map((id) => {
        const node = nodeIndex.get(id);
        return h('span', { class: 'chip' }, node ? node.label : id);
      })),
      list(change.files).length > 0 && h('div', { class: 'change-nodes' }, list(change.files).slice(0, 6).map(fileChip))));
}

function formatDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return text(value, 'undated');
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

// ---- lessons.js ----
// Chapters: key concepts (one idea per card) and check-yourself quiz.
function renderConcepts(data, mount) {
  const concepts = list(data.concepts);
  if (!concepts.length) return;
  let index = 0;
  const card = h('article', { class: 'card concept-card', 'aria-live': 'polite' });
  const controls = h('div', { class: 'carousel-controls' });

  function go(next) {
    const target = Math.min(Math.max(next, 0), concepts.length - 1);
    const direction = target >= index ? 1 : -1;
    index = target;
    render();
    slideIn(card, direction);
  }

  function render() {
    const concept = concepts[index];
    fill(card,
      h('span', { class: 'step-count' }, `Idea ${index + 1} of ${concepts.length}`),
      h('h3', null, concept.title),
      h('p', null, concept.body),
      concept.analogy && h('div', { class: 'callout' }, h('b', null, 'Think of it like'), concept.analogy),
      concept.file && h('div', { class: 'code-head' }, fileChip(concept.file)),
      concept.code && codeBlock(concept.code, concept.lang),
    );
    fill(controls,
      h('button', { class: 'btn btn-ghost btn-sm', type: 'button', disabled: index === 0, onclick: () => go(index - 1) }, 'Back'),
      stepDots(concepts.length, index, go),
      h('button', { class: 'btn btn-primary', type: 'button', disabled: index === concepts.length - 1, onclick: () => go(index + 1) }, 'Continue'),
    );
  }

  render();
  mount.append(h('div', { class: 'lesson' }, card, controls));
}

function renderQuiz(data, mount) {
  const questions = list(data.quiz);
  if (!questions.length) return;
  let results = {};
  const bar = h('div');
  const label = h('b');
  const score = h('div', { class: 'score card' }, label, h('div', { class: 'score-bar' }, bar));

  function record(index, correct) {
    results = { ...results, [index]: correct };
    const right = Object.values(results).filter(Boolean).length;
    const answered = Object.keys(results).length;
    label.textContent = `${right} / ${questions.length} correct`;
    bar.style.width = `${(right / questions.length) * 100}%`;
    if (answered === questions.length) label.textContent += right === questions.length ? ' · Perfect!' : ' · Nice work';
  }

  label.textContent = `0 / ${questions.length} correct`;
  bar.style.width = '0%';
  mount.append(h('div', { class: 'lesson quiz' }, questions.map((q, i) => questionCard(q, i, record)), score));
}

function questionCard(question, index, record) {
  const options = list(question.options);
  let picked = null;
  const optionEls = options.map((option, i) => h('button', {
    class: 'option', type: 'button', role: 'radio', 'aria-checked': 'false',
    onclick: () => pick(i),
  }, h('span', { class: 'key' }, String(i + 1)), option));
  const check = h('button', { class: 'btn btn-primary', type: 'button', disabled: true, onclick: grade }, 'Check');
  const feedback = h('div', { 'aria-live': 'polite' });

  function pick(i) {
    picked = i;
    optionEls.forEach((el, j) => el.setAttribute('aria-checked', String(j === i)));
    check.disabled = false;
  }

  function grade() {
    const correct = picked === question.answer;
    optionEls.forEach((el, j) => {
      el.disabled = true;
      el.classList.toggle('is-correct', j === question.answer);
      el.classList.toggle('is-wrong', j === picked && !correct);
    });
    check.remove();
    const pickedEl = optionEls[picked];
    if (correct) pop(pickedEl); else shake(pickedEl);
    fill(feedback, h('div', { class: `feedback ${correct ? 'is-correct' : 'is-wrong'}` },
      h('b', null, correct ? 'Correct!' : 'Not quite'),
      text(question.explain, correct ? 'You got it.' : `The answer is “${options[question.answer]}”.`)));
    riseIn(feedback.firstElementChild);
    record(index, correct);
  }

  return h('article', { class: 'card question' },
    h('span', { class: 'step-count' }, `Question ${index + 1}`),
    h('h3', null, question.question),
    h('div', { class: 'options', role: 'radiogroup', 'aria-label': question.question }, optionEls),
    feedback,
    h('div', { class: 'question-actions' }, check));
}

// ---- sections.js ----
// Static chapters: hero, where-things-live tree, glossary, runbook.

// Rough reading time, Brilliant-style: a cue for how long the tour takes.
function tourMinutes(data) {
  const steps = list(data.flows).reduce((n, f) => n + list(f.steps).length, 0);
  const minutes = 2 + steps * 0.35 + list(data.concepts).length * 0.6 + list(data.quiz).length * 0.5 + list(data.changes).length * 0.3;
  return Math.max(3, Math.round(minutes));
}

function renderHero(data, chapters) {
  const meta = data.meta || {};
  const firstChapter = chapters[0];
  const flowChapter = chapters.find((c) => c.key === 'flows');
  const glance = [
    [list(data.nodes).length, 'parts'],
    [list(data.flows).length, list(data.flows).length === 1 ? 'flow' : 'flows'],
    [list(data.changes).length, 'changes'],
    [chapters.length, 'chapters'],
  ];
  return h('section', { class: 'hero', 'aria-labelledby': 'hero-title' },
    h('div', { class: 'hero-copy' },
      h('div', { class: 'hero-eyebrow' },
        h('span', null, text(meta.repo, 'Repository')),
        h('span', { class: 'hero-dot', 'aria-hidden': 'true' }),
        h('span', null, `${tourMinutes(data)} min guided tour`)),
      h('h1', { id: 'hero-title' }, meta.title),
      h('p', { class: 'hero-summary' }, meta.summary),
      h('div', { class: 'btn-row hero-actions' },
        firstChapter && h('a', { class: 'btn btn-primary', href: `#ch-${firstChapter.key}` }, 'Start the tour'),
        flowChapter && h('a', { class: 'btn btn-ghost', href: `#ch-${flowChapter.key}` }, 'Jump to a flow')),
      h('dl', { class: 'hero-glance' }, glance.map(([value, label]) => h('div', null, h('dt', null, label), h('dd', null, String(value))))),
      list(meta.stack).length > 0 && h('div', { class: 'hero-stack' },
        h('span', { class: 'hero-stack-label' }, 'Built with'),
        list(meta.stack).map((item) => h('span', { class: 'chip' }, item)))),
    h('div', { class: 'hero-art' }, heroArt(data)));
}

// The repo's own first flow, drawn as a tidy loop of four stops inside the
// brand blob, with one dot travelling the route. Falls back to the first nodes.
const HERO_SPOTS = [{ x: 64, y: 70 }, { x: 266, y: 70 }, { x: 266, y: 246 }, { x: 64, y: 246 }];
const HERO_BOX = { w: 130, h: 104 };

function heroArt(data) {
  const nodeIndex = byId(data.nodes);
  const flow = list(data.flows)[0];
  const ids = flow ? flowActors(list(flow.steps)) : list(data.nodes).map((n) => n.id);
  const actors = ids.slice(0, 4).map((id) => nodeIndex.get(id)).filter(Boolean);
  const center = (i) => ({ x: HERO_SPOTS[i].x + HERO_BOX.w / 2, y: HERO_SPOTS[i].y + HERO_BOX.h / 2 });
  const route = actors.map((_, i) => `${i ? 'L' : 'M'}${center(i).x},${center(i).y}`).join(' ');
  const svg = s('svg', { viewBox: '0 0 460 420', role: 'img', 'aria-label': flow ? `${flow.title}: ${actors.map((a) => a.label).join(', then ')}` : 'Main parts of the system' });
  svg.append(
    s('circle', { cx: 230, cy: 218, r: 196, fill: '#d7ffb8' }),
    s('circle', { cx: 404, cy: 52, r: 30, fill: '#ffc800' }),
    s('circle', { cx: 42, cy: 372, r: 14, fill: '#1cb0f6' }),
  );
  if (actors.length > 1) {
    svg.append(s('path', { d: route, fill: 'none', stroke: '#ffffff', 'stroke-width': 14, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }),
      s('path', { d: route, fill: 'none', stroke: '#1cb0f6', 'stroke-width': 4, 'stroke-dasharray': '1 11', 'stroke-linecap': 'round' }));
  }
  actors.forEach((node, i) => svg.append(heroStop(node, i)));
  if (actors.length > 1 && !reducedMotion()) {
    svg.append(s('circle', { r: 10, fill: '#58cc02', stroke: '#ffffff', 'stroke-width': 4 },
      s('animateMotion', { dur: `${actors.length * 1.4}s`, repeatCount: 'indefinite', path: route, calcMode: 'linear' })));
  }
  if (flow) {
    svg.append(s('text', { class: 'hero-art-caption', x: 230, y: 404, 'text-anchor': 'middle' }, truncate(`▶ ${flow.title}`, 40)));
  }
  return svg;
}

function heroStop(node, index) {
  const { x, y } = HERO_SPOTS[index];
  const label = truncate(node.label, 16);
  return s('g', null,
    s('rect', { x, y: y + 6, width: HERO_BOX.w, height: HERO_BOX.h, rx: 18, fill: '#e5e5e5' }),
    s('rect', { x, y, width: HERO_BOX.w, height: HERO_BOX.h, rx: 18, fill: '#ffffff', stroke: '#e5e5e5', 'stroke-width': 3 }),
    s('circle', { cx: x + 18, cy: y + 18, r: 11, fill: '#58cc02' }),
    s('text', { class: 'hero-art-num', x: x + 18, y: y + 22, 'text-anchor': 'middle' }, String(index + 1)),
    icon(node.kind, { x: x + HERO_BOX.w / 2 - 22, y: y + 14, width: 44, height: 44 }),
    s('text', { class: 'hero-art-label', x: x + HERO_BOX.w / 2, y: y + 84, 'text-anchor': 'middle' }, label, s('title', null, node.label)));
}

function renderTree(data, mount) {
  const entries = list(data.tree);
  mount.append(h('div', { class: 'card', style: 'padding:0' }, h('ul', { class: 'tree' }, entries.map((entry) => {
    const depth = String(entry.path).replace(/\/$/, '').split('/').length - 1;
    const isDir = String(entry.path).endsWith('/');
    return h('li', { class: entry.key ? 'is-key' : '' },
      h('span', { class: 'path', style: `padding-left:${Math.min(depth, 4) * 18}px` }, icon(isDir ? 'folder' : 'file'), h('span', { class: 'path-text' }, breakablePath(entry.path))),
      h('span', { class: 'note' }, text(entry.note)));
  }))));
}

function renderGlossary(data, mount) {
  const terms = list(data.glossary);
  const input = h('input', { class: 'search', type: 'search', placeholder: 'Search terms…', 'aria-label': 'Search glossary' });
  const items = terms.map((term) => ({ term, el: h('div', null, h('dt', null, term.term), h('dd', null, term.definition)) }));
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    items.forEach(({ term, el }) => {
      el.hidden = Boolean(q) && !`${term.term} ${term.definition}`.toLowerCase().includes(q);
    });
  });
  mount.append(h('div', { class: 'lesson' }, input, h('dl', { class: 'glossary' }, items.map((item) => item.el))));
}

function renderRunbook(data, mount) {
  mount.append(h('div', { class: 'lesson runbook' }, list(data.runbook).map((item) => {
    const copy = h('button', { class: 'btn btn-ghost btn-sm', type: 'button' }, 'Copy');
    copy.addEventListener('click', () => {
      navigator.clipboard.writeText(item.command)
        .then(() => { copy.textContent = 'Copied'; })
        .catch(() => { copy.textContent = 'Select & copy'; });
    });
    return h('article', { class: 'card' },
      h('div', { class: 'code-head', style: 'margin-top:0' }, h('h3', null, item.label), item.command && copy),
      item.note && h('p', null, item.note),
      item.command && codeBlock(item.command, 'sh'));
  })));
}

// ---- app.js ----
// Boot: read the embedded data, decide which chapters exist, render the page.
const DESIGN_CREDIT = 'Visual design language inspired by Duolingo; lesson format inspired by Brilliant. Not affiliated with either.';
const CHAPTERS = [
  { key: 'map', title: 'The big picture', lead: 'Every box is one part of the system. Tap one to see what it does and who it talks to.', has: (d) => list(d.nodes).length > 0, render: renderMap },
  { key: 'flows', title: 'Follow it end to end', lead: 'Pick a flow and press Continue. Each step is one hop, with the exact file that does the work.', has: (d) => list(d.flows).length > 0, render: renderFlows },
  { key: 'changes', title: 'What changed, and why', lead: 'Recent merges from people and agents, each with its reason. Use “Show on map” to see which parts moved.', has: (d) => list(d.changes).length > 0, render: renderChanges },
  { key: 'tree', title: 'Where things live', lead: 'The folders worth knowing. Starred ones are where most changes happen.', has: (d) => list(d.tree).length > 0, render: renderTree },
  { key: 'data', title: 'The data', lead: 'What the system stores and how the pieces relate.', has: (d) => list(d.dataModel).length > 0, render: renderModels },
  { key: 'concepts', title: 'Key ideas', lead: 'The few patterns you need to read this code with confidence. One idea at a time.', has: (d) => list(d.concepts).length > 0, render: renderConcepts },
  { key: 'quiz', title: 'Check yourself', lead: 'A few quick questions. If you can answer these, you can find your way around.', has: (d) => list(d.quiz).length > 0, render: renderQuiz },
  { key: 'glossary', title: 'Glossary', lead: 'Words this codebase uses in its own way.', has: (d) => list(d.glossary).length > 0, render: renderGlossary },
  { key: 'run', title: 'Run it yourself', lead: 'Commands to get it running on your machine.', has: (d) => list(d.runbook).length > 0, render: renderRunbook },
];

function chooseChapters(data) {
  const requested = list(data.meta && data.meta.chapters);
  const order = requested.length ? requested : CHAPTERS.map((c) => c.key);
  return order
    .map((key) => CHAPTERS.find((c) => c.key === key))
    .filter((chapter) => chapter && chapter.has(data));
}

function chapterSection(chapter, index, chapters, data) {
  const intro = (data.intros || {})[chapter.key];
  const body = h('div', { class: 'chapter-body' });
  const next = chapters[index + 1];
  const section = h('section', { class: 'chapter', id: `ch-${chapter.key}`, 'aria-labelledby': `ch-${chapter.key}-title` },
    h('header', { class: 'chapter-head' },
      h('div', { class: 'chapter-eyebrow' }, h('span', { class: 'num' }, String(index + 1)), `Chapter ${index + 1} of ${chapters.length}`),
      h('h2', { id: `ch-${chapter.key}-title` }, text(intro && intro.title, chapter.title)),
      h('p', { class: 'chapter-lead' }, text(intro && intro.lead, chapter.lead))),
    body,
    next && h('div', { class: 'chapter-next' }, h('a', { class: 'btn btn-primary', href: `#ch-${next.key}` }, `Continue: ${next.title}`)));
  try {
    chapter.render(data, body);
  } catch (error) {
    body.append(h('p', { class: 'empty' }, `This chapter could not be drawn: ${error.message}`));
  }
  return section;
}

function siteHeader(chapters) {
  const progressFill = h('div', { class: 'lesson-progress-fill' });
  const pills = chapters.map((chapter, i) => h('a', { class: 'chapter-pill', href: `#ch-${chapter.key}`, 'data-key': chapter.key },
    h('span', { class: 'num' }, String(i + 1)), chapter.title));
  const header = h('header', { class: 'site-header' },
    h('div', { class: 'site-header-inner' },
      h('a', { class: 'brand', href: '#main' }, brandMark(), h('span', { class: 'brand-text' }, 'Repo Explainer')),
      h('div', { class: 'lesson-progress', role: 'progressbar', 'aria-label': 'Tour progress', 'aria-valuemin': '0', 'aria-valuemax': '100' }, progressFill)),
    h('nav', { class: 'chapter-nav', 'aria-label': 'Chapters' }, pills));
  return { header, progressFill, pills };
}

function trackProgress(progressFill, pills) {
  const bar = progressFill.parentElement;
  const update = () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? Math.min(100, Math.round((window.scrollY / max) * 100)) : 100;
    progressFill.style.width = `${pct}%`;
    bar.setAttribute('aria-valuenow', String(pct));
  };
  window.addEventListener('scroll', update, { passive: true });
  update();

  const observer = new IntersectionObserver((entries) => {
    entries.filter((e) => e.isIntersecting).forEach((entry) => {
      const key = entry.target.id.replace('ch-', '');
      const activeIndex = pills.findIndex((p) => p.dataset.key === key);
      pills.forEach((pill, i) => {
        pill.classList.toggle('is-active', i === activeIndex);
        pill.classList.toggle('is-done', i < activeIndex);
      });
      // Scroll only the nav strip sideways; scrollIntoView would also nudge
      // the page and cancel the reader's scroll momentum.
      const pill = pills[activeIndex];
      if (pill) {
        const nav = pill.parentElement;
        nav.scrollTo({ left: pill.offsetLeft - nav.clientWidth / 2 + pill.offsetWidth / 2, behavior: 'smooth' });
      }
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  document.querySelectorAll('.chapter').forEach((el) => observer.observe(el));
}

function fatal(app, message) {
  fill(app, h('div', { class: 'fatal', role: 'alert' }, h('h1', null, 'This explainer could not load'), h('p', null, message)));
}

function boot() {
  const app = document.getElementById('app');
  let data;
  try {
    data = JSON.parse(document.getElementById('explainer-data').textContent);
  } catch (error) {
    fatal(app, `The embedded data is not valid JSON (${error.message}). Rebuild with scripts/build.mjs.`);
    return;
  }
  if (!data || !data.meta || !data.meta.title) {
    fatal(app, 'The embedded data has no meta.title. Run scripts/validate.mjs to see what is missing.');
    return;
  }
  const chapters = chooseChapters(data);
  const { header, progressFill, pills } = siteHeader(chapters);
  const main = h('main', { id: 'main', tabindex: '-1' },
    h('div', { class: 'wrap' }, renderHero(data, chapters), chapters.map((c, i) => chapterSection(c, i, chapters, data))));
  const meta = data.meta;
  const footer = h('footer', { class: 'site-footer' },
    h('p', null, `Generated ${meta.generatedAt ? `on ${formatDate(meta.generatedAt)} ` : ''}${meta.commit ? `at ${String(meta.commit).slice(0, 7)} ` : ''}with repo-explainer.`),
    h('p', null, DESIGN_CREDIT));
  fill(app, header, main, footer);
  app.removeAttribute('aria-busy');
  trackProgress(progressFill, pills);
  revealOnScroll();
}

// Chapters rise in once as they enter the viewport. Content is never hidden
// unless the observer exists and motion is allowed.
function revealOnScroll() {
  if (reducedMotion() || !('IntersectionObserver' in window)) return;
  const targets = [...document.querySelectorAll('.chapter-head')];
  const observer = new IntersectionObserver((entries) => {
    entries.filter((e) => e.isIntersecting).forEach((entry) => {
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    });
  }, { rootMargin: '0px 0px -4% 0px' });
  targets.forEach((el) => {
    el.classList.add('reveal');
    observer.observe(el);
  });
}


boot();
})();
</script>
</body>
</html>
